<!DOCTYPE html>
<html lang="{LANGUAGE}" dir="{TEXT_DIRECTION}">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	{META_DATA}

	<!-- BEGIN for_ui_examples_only -->
	<!-- ATTENTION: This only exists to provide an example of the complete page.     -->
	<!-- This won't be included in renderings of ordinary pages. Also have a look    -->
	<!-- into \ILIAS\UI\Implementation\Component\Layout\Page\Renderer::setHeaderVars -->
	<base href="{BASE}" />
	<!-- END for_ui_examples_only -->

	<title>{VIEW_TITLE}: {SHORT_TITLE}</title>
	<!-- uzk-patch: begin -->
	<!-- id required so anticheat.js can swap the favicon at runtime -->
	<link id="custom_favicon" rel="icon" href="{FAVICON_PATH}" type="image/x-icon">
	<!-- uzk-patch: end -->

	<!-- This is the safest place for now to initialize our global namespace which is -->
	<!-- used by several scripts included on the way to expose their business logic.  -->
	<script type="application/javascript">var il = il ||{}; window.il = il;</script>

	<style>
		{CSS_INLINE}
	</style>

	<!-- BEGIN css_file -->
	<link rel="stylesheet" type="text/css" href="{CSS_FILE}" />
	<!-- END css_file -->
</head>
<body>
	<!-- BEGIN mode_info -->
	{MODEINFO}
	<!-- END mode_info -->

	<div class="il-page-overlay">
		{OVERLAY}
	</div>

	<div class="il-layout-page<!-- BEGIN slates_engaged --> with-mainbar-slates-engaged<!-- END slates_engaged -->" <!-- BEGIN with_id --> id="{ID}"<!-- END with_id -->>
		<header>
			<div class="header-inner">
				<div class="il-logo">
					<span class="hidden-xs">{LOGO}</span>
					<span class="visible-xs-block">{RESPONSIVE_LOGO}</span>
					<div class="il-pagetitle">
						{TITLE}
					</div>
				</div>

				<!-- BEGIN header_locator -->
				<nav class="il-header-locator">
					{HEADER_BREADCRUMBS}
				</nav>
				<!-- END header_locator -->
				{METABAR}
			</div>
		</header>

		<div class="il-system-infos">
			{SYSTEMINFOS}
		</div>

		<div class="nav il-maincontrols">
			{MAINBAR}
		</div>

		<!-- html5 main-tag is not supported in IE / div is needed -->
		<main class="il-layout-page-content">
			<!-- BEGIN content_breadcrumbs -->
			<div class="breadcrumbs">
				{BREADCRUMBS}
			</div>
			<!-- END content_breadcrumbs -->

			{CONTENT}

			<!-- BEGIN pagefooter -->
			<footer role="contentinfo">
				{FOOTER}
			</footer>
			<!-- END pagefooter -->
		</main>

	</div>

<!-- BEGIN js_file -->
<script src="{JS_FILE}"></script>
<!-- END js_file -->

<!-- BEGIN on_load_code -->
<script>
	<!-- BEGIN on_load_code_inner -->
		il.Util.addOnLoad(function() {
			{OLCODE}
		});
	<!-- END on_load_code_inner -->
</script>
<!-- END on_load_code -->

<!-- uzk-patch: begin -->
<!-- watermark template used by anticheat.js; only activated for #tst_output -->
<div class="ilNoDisplay">
	<svg id="test-active-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
		<defs>
			<linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%" spreadMethod="pad" gradientTransform="rotate(45)">
				<stop offset="0%" stop-color="#fbfbfb" stop-opacity="0.1"/>
				<stop offset="100%" stop-color="#32475B" stop-opacity="1"/>
			</linearGradient>
			<pattern id="pattern" x="0" y="0" width="90" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
				<text id="test-active-svg-content" x="0" y="20" style="font-family:Verdana; font-size:20px; font-weight:bold; stroke:none; fill:#32475B; fill-opacity:0.15">active_id</text>
			</pattern>
		</defs>
		<rect x="0" y="0" rx="10" ry="10" width="100%" height="100%" style="fill: url(#gradient); fill-opacity:0.3;"/>
		<rect x="0" y="0" rx="10" ry="10" width="100%" height="100%" style="fill: url(#pattern); fill-opacity:0.3;"/>
	</svg>
</div>
<script src="./Customizing/global/skin/uoc/skin_assessment/js/anticheat.js"></script>
<!-- uzk-patch: end -->

</body>
</html>
